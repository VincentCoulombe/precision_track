# ================================
# General on/off options
# ================================
booleans:
  pipelined: false
  with_validation: false
  with_offline_correction_refinement: false
  with_action_recognition: false
  with_group_action_recognition: false
  with_pose_estimation: true

# ================================
# General directories and paths
# ================================
general:
  metainfo: "../configs/metadata/mice.py"

# ================================
# Training parameters, directories and paths
# ================================
training:
  dataset_name: "mice"

  data_root: "../../datasets/MICE/pose-estimation_640x640/"

  resume: false
  training_checkpoint: "../checkpoints/model_ap/model_ap.pth"

  deploying_directory: "../checkpoints/mice/"

  deploying_sanity_check_img_path: "images/0000003435.jpg"

  batch_size: 38 # Warning: The training is unstable with batch sizes < 16.
  wandb_logging: false

# ================================
# Tracking parameters, directories and paths
# ================================
tracking:
  saving_directory: "../work_dir/"
  num_subjects: { "mouse": 1 }

  tracking_checkpoint_name: "model_mice_DEPLOYED_NVIDIAGeForceRTX3090_FP16.engine"

  hyperparameters_file_name: "hyperparameters.json"

  output_clustered_features: false

  mot_data_root: "../../datasets/MICE/re-id/mot_w_aruco/"

# ================================
# Action Recognition parameters
# ================================
action_recognition:
  mart_checkpoint_name: "mart_DEPLOYED.pth"
  action_recognition_data_root: "../../datasets/MICE/sequential/"
  output_action_recognition_embeddings: false

# ================================
# Group Action Recognition parameters
# ================================
group_action_recognition:
  gmart_checkpoint_name: "gmart_DEPLOYED.pth"

# ================================
# Validation parameters
# ================================
validation:
  validation_configuration_file: "../configs/settings/validation/appearance.yaml"
  output_appearance_database: false

# ================================
# Visualization parameters
# ================================
visualization:
  display_bounding_boxes: true
  display_poses: true
  display_velocities: false
  display_species: false
  display_confidence_scores: false
  display_actions: false
  display_search_zones: false
  display_validations: false
  display_untracked_detections: true
  display_predicted_bounding_boxes: false
